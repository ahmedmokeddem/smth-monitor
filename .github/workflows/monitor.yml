name: ARPEJ monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *' # Every 15 minutes (UTC)
permissions:
  contents: write
concurrency:
  group: arpej-monitor
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Scan ARPEJ and alert Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py
      - name: Persist successful scan
        run: |
          if [[ -n "$(git status --porcelain -- state.json)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            git commit -m 'chore: update availability state [skip ci]'
            git push
          fi
